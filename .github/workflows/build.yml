yaml
name: Build SAE22 Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unzip project
        run: unzip -o SAE22App.zip

      - name: Decode keystore
        working-directory: SAE22App
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > sae22-release.keystore

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build signed release APK
        working-directory: SAE22App
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: SAE22-release-signed
          path: SAE22App/app/build/outputs/apk/release/*.apk
